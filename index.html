<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Stream Ninja - Bullet Chat (2560x1440)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #danmaku-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .bullet-msg {
      position: absolute;
      left: 100vw;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      font-size: 46px;
      font-weight: 800;
      color: #ffffff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0px  4px 10px rgba(0, 0, 0, 0.9);
      will-change: transform;
    }
    .bullet-name { color: #ffd166; }
    .bullet-msg img { height: 48px; width: auto; vertical-align: middle; }
  </style>
</head>
<body>
  <div id="danmaku-stage"></div>

  <script>
    const CONFIG = {
      baseDurationSeconds: 13,
      topMarginPercent: 4,
      bottomMarginPercent: 85,
      laneHeightPx: 70,
      showUsernames: true,
      showStartupTest: true
    };

    const urlParams = new URLSearchParams(window.location.search);
    const roomID = urlParams.get("session");
    const password = urlParams.get("password") || urlParams.get("pass") || urlParams.get("pw") || "false";

    // Exact WebRTC connection handshake used by Social Stream Ninja's sampleoverlay.html
    if (roomID) {
      const iframe = document.createElement("iframe");
      iframe.src = "https://socialstream.ninja" + encodeURIComponent(password) + "&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=" + encodeURIComponent(roomID);
      iframe.style.cssText = "width: 0px; height: 0px; position: fixed; left: -100px; top: -100px; border: 0;";
      document.body.appendChild(iframe);

      window.addEventListener("message", function (e) {
        if (e.source != iframe.contentWindow) return;
        if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object" && e.data.dataReceived.overlayNinja) {
          processData(e.data.dataReceived.overlayNinja);
        }
      });
    }

    // Optional WebSocket fallback if &server or &server2 is ever added
    if (roomID && (urlParams.has("server") || urlParams.has("server2"))) {
      const serverURL = urlParams.get("server") || urlParams.get("server2") || "wss://io.socialstream.ninja";
      function connectWS() {
        const ws = new WebSocket(serverURL);
        ws.onopen = () => ws.send(JSON.stringify({ join: roomID, out: 3, in: 4 }));
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data) processData(data);
          } catch (err) {}
        };
        ws.onclose = () => setTimeout(connectWS, 2000);
      }
      connectWS();
    }

    // Lane & Animation Engine
    const stage = document.getElementById("danmaku-stage");
    const usableTop = (window.innerHeight * CONFIG.topMarginPercent) / 100;
    const usableBottom = (window.innerHeight * CONFIG.bottomMarginPercent) / 100;
    const totalLanes = Math.max(1, Math.floor((usableBottom - usableTop) / CONFIG.laneHeightPx));
    const laneAvailableAt = new Array(totalLanes).fill(0);

    function getFreeLane() {
      const now = performance.now();
      const freeLanes = [];
      for (let i = 0; i < totalLanes; i++) {
        if (laneAvailableAt[i] <= now) freeLanes.push(i);
      }
      if (freeLanes.length > 0) {
        return freeLanes[Math.floor(Math.random() * freeLanes.length)];
      }
      let earliest = 0;
      for (let i = 1; i < totalLanes; i++) {
        if (laneAvailableAt[i] < laneAvailableAt[earliest]) earliest = i;
      }
      return earliest;
    }

    function processData(data) {
      if (!data || typeof data !== "object") return;
      if (data.content) data = data.content;
      if (!data.chatmessage && !data.hasDonation) return;

      const msgEl = document.createElement("div");
      msgEl.className = "bullet-msg";

      if (CONFIG.showUsernames && data.chatname) {
        const nameSpan = document.createElement("span");
        nameSpan.className = "bullet-name";
        if (data.nameColor) nameSpan.style.color = data.nameColor;
        nameSpan.textContent = `${data.chatname}:`;
        msgEl.appendChild(nameSpan);
      }

      const textSpan = document.createElement("span");
      textSpan.innerHTML = data.chatmessage || data.hasDonation;
      msgEl.appendChild(textSpan);

      const laneIndex = getFreeLane();
      msgEl.style.top = `${usableTop + laneIndex * CONFIG.laneHeightPx}px`;
      stage.appendChild(msgEl);

      const msgWidth = msgEl.offsetWidth;
      const totalDistance = window.innerWidth + msgWidth;
      const durationMs = CONFIG.baseDurationSeconds * 1000;
      const pixelsPerMs = totalDistance / durationMs;

      laneAvailableAt[laneIndex] = performance.now() + (msgWidth + 80) / pixelsPerMs;

      const anim = msgEl.animate(
        [{ transform: "translateX(0px)" }, { transform: `translateX(-${totalDistance}px)` }],
        { duration: durationMs, easing: "linear" }
      );
      anim.onfinish = () => msgEl.remove();
    }

    if (CONFIG.showStartupTest) {
      setTimeout(() => {
        processData({
          chatname: roomID ? "System" : "Error",
          chatmessage: roomID
            ? "Bullet Chat Ready! Send a message in SSN..."
            : "Missing ?session=YOUR_ID in OBS Browser URL!"
        });
      }, 1500);
    }
  </script>
</body>
</html>
