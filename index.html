<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Stream Ninja - Bullet Chat (2560x1440)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #danmaku-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .bullet-msg {
      position: absolute;
      left: 100vw;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      font-size: 46px;
      font-weight: 800;
      color: #ffffff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0px  4px 10px rgba(0, 0, 0, 0.9);
      will-change: transform;
    }
    .bullet-name { color: #ffd166; }
    .bullet-msg img { height: 48px; width: auto; vertical-align: middle; }
  </style>
</head>
<body>
  <div id="danmaku-stage"></div>

  <script>
    const CONFIG = {
      baseDurationSeconds: 13,
      topMarginPercent: 4,
      bottomMarginPercent: 85,
      laneHeightPx: 70,
      showUsernames: true,
      showStartupTest: true
    };

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get("session");
    const password = urlParams.get("password") || "false";
    const useServer = urlParams.has("server") || urlParams.has("wss");

    // 1. Official Social Stream Ninja WebRTC Iframe Bridge (with required &solo flag)
    if (sessionId && !useServer) {
      const iframe = document.createElement("iframe");
      iframe.src = `https://socialstream.ninja{encodeURIComponent(password)}&solo&view=${encodeURIComponent(sessionId)}&novideo&noaudio&label=bulletchat&cleanoutput&room=${encodeURIComponent(sessionId)}`;
      iframe.style.width = "0px";
      iframe.style.height = "0px";
      iframe.style.position = "fixed";
      iframe.style.left = "-100px";
      iframe.style.top = "-100px";
      iframe.style.border = "0";
      document.body.appendChild(iframe);
    }

    // 2. Official Social Stream Ninja WebSocket Bridge (if &server or &wss is in your URL)
    if (sessionId && useServer) {
      function connectWS() {
        const ws = new WebSocket("wss://io.socialstream.ninja");
        ws.onopen = () => {
          ws.send(JSON.stringify({ join: sessionId, out: 1, in: 2 }));
        };
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            handleIncomingData(data);
          } catch (err) {}
        };
        ws.onclose = () => setTimeout(connectWS, 3000);
      }
      connectWS();
    }

    // 3. Lane & Animation Engine
    const stage = document.getElementById("danmaku-stage");
    const usableTop = (window.innerHeight * CONFIG.topMarginPercent) / 100;
    const usableBottom = (window.innerHeight * CONFIG.bottomMarginPercent) / 100;
    const totalLanes = Math.max(1, Math.floor((usableBottom - usableTop) / CONFIG.laneHeightPx));
    const laneAvailableAt = new Array(totalLanes).fill(0);

    function getFreeLane() {
      const now = performance.now();
      const freeLanes = [];
      for (let i = 0; i < totalLanes; i++) {
        if (laneAvailableAt[i] <= now) freeLanes.push(i);
      }
      if (freeLanes.length > 0) {
        return freeLanes[Math.floor(Math.random() * freeLanes.length)];
      }
      let earliest = 0;
      for (let i = 1; i < totalLanes; i++) {
        if (laneAvailableAt[i] < laneAvailableAt[earliest]) earliest = i;
      }
      return earliest;
    }

    function spawnBullet(data) {
      if (!data || !data.chatmessage) return;

      const msgEl = document.createElement("div");
      msgEl.className = "bullet-msg";

      if (CONFIG.showUsernames && data.chatname) {
        const nameSpan = document.createElement("span");
        nameSpan.className = "bullet-name";
        if (data.nameColor) nameSpan.style.color = data.nameColor;
        nameSpan.textContent = `${data.chatname}:`;
        msgEl.appendChild(nameSpan);
      }

      const textSpan = document.createElement("span");
      textSpan.innerHTML = data.chatmessage;
      msgEl.appendChild(textSpan);

      const laneIndex = getFreeLane();
      msgEl.style.top = `${usableTop + laneIndex * CONFIG.laneHeightPx}px`;
      stage.appendChild(msgEl);

      const msgWidth = msgEl.offsetWidth;
      const totalDistance = window.innerWidth + msgWidth;
      const durationMs = CONFIG.baseDurationSeconds * 1000;
      const pixelsPerMs = totalDistance / durationMs;

      laneAvailableAt[laneIndex] = performance.now() + (msgWidth + 80) / pixelsPerMs;

      const anim = msgEl.animate(
        [{ transform: "translateX(0px)" }, { transform: `translateX(-${totalDistance}px)` }],
        { duration: durationMs, easing: "linear" }
      );
      anim.onfinish = () => msgEl.remove();
    }

    function handleIncomingData(raw) {
      if (!raw) return;
      if (raw.dataReceived && raw.dataReceived.overlayNinja) {
        spawnBullet(raw.dataReceived.overlayNinja);
      } else if (raw.overlayNinja) {
        spawnBullet(raw.overlayNinja);
      } else if (raw.chatmessage) {
        spawnBullet(raw);
      }
    }

    // Listen for WebRTC iframe messages
    window.addEventListener("message", (e) => {
      handleIncomingData(e.data);
    });

    // Startup visual check
    if (CONFIG.showStartupTest) {
      setTimeout(() => {
        spawnBullet({
          chatname: sessionId ? "System" : "Error",
          chatmessage: sessionId
            ? `Connected (${useServer ? "Server Mode" : "P2P Mode"})! Waiting for messages...`
            : "Missing ?session=YOUR_ID in OBS Browser URL!"
        });
      }, 1500);
    }
  </script>
</body>
</html>
